name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-synth:
    name: Test and CDK synth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: CDK synth
        run: npx cdk synth --lookups false
